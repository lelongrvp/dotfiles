[font]
size = 14.0

[font.normal]
family = "Hack Nerd Font Mono"

[window]
startup_mode = "Maximized"
option_as_alt = "Both"
padding = { x = 12, y = 10 }
dynamic_padding = true
opacity = 0.97
blur = true

[terminal]
osc52 = "OnlyCopy"

[mouse]
hide_when_typing = true

[[keyboard.bindings]]
key = "="
mods = "Super"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "-"
mods = "Super"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "0"
mods = "Super"
action = "ResetFontSize"

[hints]
enabled = [
  { regex = "(mailto:|https://|http://|file:|ssh:|git://)[^ ]+", action = "Copy", post_processing = true, binding = { key = "U", mods = "Control|Shift" }, mouse = { enabled = true } },
]

[colors.primary]
background = "#1d2021"
foreground = "#ebdbb2"

[colors.cursor]
text = "#1d2021"
cursor = "#ebdbb2"

[colors.normal]
black = "#1d2021"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"
